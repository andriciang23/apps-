name: Deploy Sip Log to GitHub Pages

on:
  push:
    branches: [claude/drink-tracking-app-hqtncx, main]
    paths: [drink-tracker/**]
  workflow_dispatch: # lets you trigger it manually from GitHub too

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: drink-tracker/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps
        working-directory: drink-tracker

      - name: Build web app
        run: npx expo export --platform web
        working-directory: drink-tracker
        env:
          # Must match the GitHub Pages path: https://andriciang23.github.io/apps-/
          EXPO_BASE_URL: /apps-

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: drink-tracker/dist
          commit_message: "Deploy Sip Log web app"
